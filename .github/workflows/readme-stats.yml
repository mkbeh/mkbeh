      - name: Generate rust-simple-chat — light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=rust-simple-chat&theme=graywhite&description_lines_count=3&show_owner=false
          path: profile/rust-simple-chat-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # Commit generated cards

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No README stats changes"
            exit 0
          fi

          git commit -m "chore: update readme stats"
          git push